apiVersion: v1
kind: Secret
metadata:
  name: lucia
  namespace: lucia
  labels:
    app.kubernetes.io/name: lucia
    app.kubernetes.io/component: secret
type: Opaque
data:
  # NOTE: These are base64 encoded values. Replace with your actual secrets.
  # Generate base64: echo -n "value" | base64

  # Chat Model API Key
  ConnectionStrings__chat-model-api-key: c2stY2hhbmdlLW1lLXRvLXlvdXItYWN0dWFsLWtleQ==  # sk-change-me-to-your-actual-key

  # Embedding Model API Key
  ConnectionStrings__embedding-model-api-key: Y2hhbmdlLW1lLXRvLXlvdXItYWN0dWFsLWtleQ==  # change-me-to-your-actual-key

  # Home Assistant API Token
  HomeAssistant__AccessToken: Y2hhbmdlLW1lLXRvLXlvdXItaGEtdG9rZW4=  # change-me-to-your-ha-token

  # Internal service-to-service authentication token
  # Used by external A2A agents to authenticate with the AgentHost registry.
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  InternalAuth__Token: Y2hhbmdlLW1lLXRvLWEtcmFuZG9tLXNlY3JldA==  # change-me-to-a-random-secret

stringData:
  # PostgreSQL superuser password and the Npgsql connection strings built from it.
  # Replace REPLACE_WITH_POSTGRES_PASSWORD in all four places with the same value.
  # Avoid ';' in the password because it is embedded in the connection strings.
  POSTGRES_PASSWORD: "REPLACE_WITH_POSTGRES_PASSWORD"
  ConnectionStrings__luciaconfig: "Host=lucia-postgres;Port=5432;Database=luciaconfig;Username=postgres;Password=REPLACE_WITH_POSTGRES_PASSWORD"
  ConnectionStrings__luciatraces: "Host=lucia-postgres;Port=5432;Database=luciatraces;Username=postgres;Password=REPLACE_WITH_POSTGRES_PASSWORD"
  ConnectionStrings__luciatasks: "Host=lucia-postgres;Port=5432;Database=luciatasks;Username=postgres;Password=REPLACE_WITH_POSTGRES_PASSWORD"

  # URL-encode the space after Basic. Replace the value before enabling remote export.
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic%20REPLACE_WITH_BASE64_CREDENTIALS"
