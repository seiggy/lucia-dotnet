{{- /*
Lucia bundled PostgreSQL credentials

Holds the superuser password and the three Npgsql connection strings the AgentHost
consumes. The password is generated once and reused on upgrade (lookup), or taken
from bundledPostgres.auth.password when set. Passwords never contain ';' so they are
safe to embed in a connection string.
*/ -}}

{{- if .Values.bundledPostgres.enabled }}
{{- $name := printf "%s-postgres" (include "lucia.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.bundledPostgres.auth.password | default "" }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "lucia.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- range $database := list "luciaconfig" "luciatraces" "luciatasks" }}
  {{ $database }}: {{ printf "Host=%s;Port=%v;Database=%s;Username=postgres;Password=%s" $name (include "lucia.postgres.port" $) $database $password | quote }}
  {{- end }}
{{- end }}