# Lucia Agent Host - Docker Compose Configuration for Jetson Nano
#
# Optimized for ARM64 Jetson Nano with limited resources (4GB RAM typical).
# Uses the Dockerfile.agenthost-jetson build with no speech pipeline.
#
# Services:
#   - lucia: Agent Host API (no voice pipeline)
#   - lucia-redis: Task persistence and session state
#   - lucia-postgres: Configuration, trace capture and task storage
#
# Resource constraints are tighter than standard deployment:
#   - Redis: 128MB max (instead of 256MB)
#   - PostgreSQL: 256MB max
#   - AgentHost: CPU ≤ 1.5, Memory ≤ 512MB (instead of 2 CPU, 1GB)
#
# Usage:
#   docker compose -f docker-compose.jetson.yml up -d
#   docker compose -f docker-compose.jetson.yml logs -f lucia

services:

  # ========================================================================
  # Redis Service - Task Persistence and Session State
  # ========================================================================
  lucia-redis:
    # Use official Redis 8.2 image with alpine for minimal size
    image: redis:8.2-alpine
    
    container_name: lucia-redis-jetson
    
    # Network configuration
    networks:
      - lucia-network
    
    # Port exposure (only on localhost for security)
    ports:
      - "127.0.0.1:6379:6379"
    
    # Command to enable persistence
    # AOF (Append-Only File) enabled for durability
    # maxmemory policy for automatic eviction (reduced for Jetson)
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
    
    # Volume for persistent data storage
    volumes:
      - lucia-redis-data:/data
    
    # Health check for automatic restart
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "PING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Resource limits (tighter for Jetson)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-redis-jetson"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only filesystem except for /data
    read_only: true
    tmpfs:
      - /tmp


  # ========================================================================
  # PostgreSQL Service - Configuration, Trace Capture and Task Storage
  # ========================================================================
  lucia-postgres:
    # Pinned major version. The init script creates the luciaconfig, luciatraces
    # and luciatasks databases the first time the data volume is initialised.
    image: postgres:17-alpine

    container_name: lucia-postgres-jetson

    networks:
      - lucia-network

    volumes:
      - lucia-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

    environment:
      # Superuser password. Avoid ';' in the value: it is also embedded in the
      # Npgsql connection strings below.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or infra/docker/.env}

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-postgres-jetson"

    security_opt:
      - no-new-privileges:true

  # ========================================================================
  # Lucia Agent Host Service - Main Application (Jetson Nano ARM64 Build)
  # ========================================================================
  lucia:
    # Build from local Dockerfile.agenthost-jetson for ARM64
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agenthost-jetson
      args:
        BUILD_CONFIGURATION: Release
        BUILD_TARGET_FRAMEWORK: net10.0
      cache_from:
        - lucia:jetson

    image: seiggy/lucia-agenthost:jetson

    container_name: lucia-jetson

    # Depends on Redis and PostgreSQL being healthy
    depends_on:
      lucia-redis:
        condition: service_healthy
      lucia-postgres:
        condition: service_healthy
    
    # Network configuration
    networks:
      - lucia-network
    
    # Port exposure (HTTP only — HTTPS handled by reverse proxy in production)
    ports:
      - "7233:8080"
    
    # Volume mounts (no model storage — no speech pipeline on Jetson)
    # Only plugin directory for future extensibility
    volumes:
      - lucia-plugins:/app/plugins
    
    # All user configuration (LLM keys, Home Assistant connection, etc.) is handled
    # by the setup wizard on first launch and stored in PostgreSQL. No .env file needed.
    environment:
      # ASP.NET Core configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      
      # PostgreSQL (infrastructure, not user-configurable)
      - DataProvider__Store=PostgreSQL
      - DataProvider__Cache=Redis
      - ConnectionStrings__luciaconfig=Host=lucia-postgres;Port=5432;Database=luciaconfig;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - ConnectionStrings__luciatraces=Host=lucia-postgres;Port=5432;Database=luciatraces;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - ConnectionStrings__luciatasks=Host=lucia-postgres;Port=5432;Database=luciatasks;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      
      # Redis connection string
      - ConnectionStrings__redis=lucia-redis:6379
      
      # .NET Runtime
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - DOTNET_RUNNING_IN_CONTAINER=true
      - COMPlus_EnableDiagnostics=0
    
    # Health check for automatic restart
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits (reduced for Jetson Nano's 4GB RAM)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "lucia-jetson"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only filesystem for security
    read_only: true
    tmpfs:
      - /tmp
      - /app/bin


# ============================================================================
# Networks
# ============================================================================
networks:
  lucia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16


# ============================================================================
# Volumes
# ============================================================================
volumes:
  # Redis persistent data
  lucia-redis-data:
    driver: local
  
  # PostgreSQL persistent data
  lucia-postgres-data:
    driver: local
  
  # Plugin storage (for future extensibility)
  lucia-plugins:
    driver: local
