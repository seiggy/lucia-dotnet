# Lucia Agent Host - Docker Compose Configuration
#
# Default deployment runs in "standalone" mode where all agents (music, timer)
# are embedded in the main AgentHost process. No separate A2A containers needed.
#
# For mesh/multi-container deployment with separate A2A agents, set
# Deployment__Mode=mesh on the lucia service and add your agent containers.
# See the Kubernetes Helm chart for a full mesh deployment example.
#
# Services:
#   - lucia: Agent Host API (all agents embedded in standalone mode)
#   - lucia-redis: Task persistence and session state
#   - lucia-postgres: Configuration, trace capture and task storage
#
# Usage:
#   # Start all services
#   docker-compose up -d
#
#   # View logs
#   docker-compose logs -f lucia
#
#   # Stop services
#   docker-compose down
#
#   # Remove volumes (deletes persisted data)
#   docker-compose down -v

services:

  # ========================================================================
  # Redis Service - Task Persistence and Session State
  # ========================================================================
  lucia-redis:
    # Use official Redis 8.2 image with alpine for minimal size
    image: redis:8.2-alpine
    
    container_name: lucia-redis
    
    # Network configuration
    networks:
      - lucia-network
    
    # Port exposure (only on localhost for security)
    ports:
      - "127.0.0.1:6379:6379"
    
    # Command to enable persistence
    # AOF (Append-Only File) enabled for durability
    # maxmemory policy for automatic eviction
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
    
    # Volume for persistent data storage
    volumes:
      - lucia-redis-data:/data
    
    # Health check for automatic restart
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "PING"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-redis"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only filesystem except for /data
    read_only: true
    tmpfs:
      - /tmp


  # ========================================================================
  # PostgreSQL Service - Configuration, Trace Capture and Task Storage
  # ========================================================================
  lucia-postgres:
    # Pinned major version. The init script creates the luciaconfig, luciatraces
    # and luciatasks databases the first time the data volume is initialised.
    image: postgres:17-alpine

    container_name: lucia-postgres

    networks:
      - lucia-network

    volumes:
      - lucia-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

    environment:
      # Superuser password. Avoid ';' in the value: it is also embedded in the
      # Npgsql connection strings below.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or infra/docker/.env}

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-postgres"

    security_opt:
      - no-new-privileges:true

  # ========================================================================
  # Lucia Agent Host Service - Main Application
  # ========================================================================
  lucia:
    # Build from local Dockerfile
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
        BUILD_TARGET_FRAMEWORK: net10.0
      cache_from:
        - lucia:latest

    image: lucia:latest

    container_name: lucia

    # Depends on Redis and PostgreSQL being healthy
    depends_on:
      lucia-redis:
        condition: service_healthy
      lucia-postgres:
        condition: service_healthy
    
    # Network configuration
    networks:
      - lucia-network
    
    # Port exposure (HTTP only — HTTPS handled by reverse proxy in production)
    ports:
      - "7233:8080"
    
    # Volume mounts
    volumes:
      # Model storage: Writable by appuser (1100:1100), persists across container recreation
      - lucia-models:/app/models
    
    # All user configuration (LLM keys, Home Assistant connection, etc.) is handled
    # by the setup wizard on first launch and stored in PostgreSQL. Set POSTGRES_PASSWORD in .env.
    environment:
      # ASP.NET Core configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      
      # PostgreSQL (infrastructure, not user-configurable)
      - DataProvider__Store=PostgreSQL
      - DataProvider__Cache=Redis
      - ConnectionStrings__luciaconfig=Host=lucia-postgres;Port=5432;Database=luciaconfig;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - ConnectionStrings__luciatraces=Host=lucia-postgres;Port=5432;Database=luciatraces;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - ConnectionStrings__luciatasks=Host=lucia-postgres;Port=5432;Database=luciatasks;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      
      # Redis connection string
      - ConnectionStrings__redis=lucia-redis:6379
      
      # .NET Runtime
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - DOTNET_RUNNING_IN_CONTAINER=true
      - COMPlus_EnableDiagnostics=0
    
    # Health check for automatic restart
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "lucia"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only filesystem for security
    read_only: true
    tmpfs:
      - /tmp
      - /app/bin
    
    # Capability dropping for reduced attack surface
    cap_drop:
      - NET_RAW
      - SYS_PTRACE
      - SYS_ADMIN


  # ========================================================================
  # Optional: Home Assistant Service (for local testing)
  # ========================================================================
  # Uncomment to run Home Assistant in same Docker Compose
  # homeassistant:
  #   image: homeassistant/home-assistant:latest
  #   container_name: lucia-homeassistant
  #   networks:
  #     - lucia-network
  #   ports:
  #     - "127.0.0.1:8123:8123"
  #   environment:
  #     - TZ=UTC
  #   volumes:
  #     - homeassistant-data:/config
  #   restart: unless-stopped


# ============================================================================
# Networks
# ============================================================================
networks:
  lucia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16


# ============================================================================
# Volumes
# ============================================================================
volumes:
  # Redis persistent data
  lucia-redis-data:
    driver: local
  
  # PostgreSQL persistent data
  lucia-postgres-data:
    driver: local
  
  # Lucia model storage (writable by appuser, persists across container recreations)
  # Stores STT, VAD, wake-word, speech-enhancement, and speaker-embedding ONNX models
  lucia-models:
    driver: local
  
  # Uncomment for Home Assistant persistent data
  # homeassistant-data:
  #   driver: local

