# Lucia Voice — Jetson Orin Nano Super (L4T R36.4.7)
# ============================================================================
# Self-contained stack: PostgreSQL + Redis + AgentHost (voice/CUDA) + telemetry.
# One Compose project, one default bridge network. No external coupling.
#
# Required environment (set before deploy or in .env):
#   LUCIA_IMAGE       — immutable ref: name@sha256:<64hex> or sha256:<64hex>
#   POSTGRES_PASSWORD — Postgres superuser password (postgres init only). Npgsql
#                       connection strings (CS_LUCIACONFIG/TRACES/TASKS) are built
#                       by deploy-jetson.sh to safely handle arbitrary password content.
#   OTEL_EXPORTER_OTLP_HEADERS — OTLP authorization header. Keep it outside this file.
#                                deploy-jetson.sh derives the Collector header from it.
#   DASHBOARD_API_KEY — dashboard login key. Changing it resets the active dashboard key.
#
# Optional environment:
#   OTEL_EXPORTER_OTLP_ENDPOINT — defaults to the remote Lucia collector.
#   LUCIA_CA_BUNDLE             — host CA bundle trusted by the container. The default
#                                 is generated by update-ca-certificates on the Jetson.
#
# Deploy via:  deploy-jetson.sh --image <ref>
# Dry-run:     deploy-jetson.sh --image <ref> --dry-run

services:

  # --------------------------------------------------------------------------
  # PostgreSQL 17 — configuration, traces, and task databases.
  # Image pinned to arm64 (linux/arm64/v8) manifest digest verified 2026-07-18.
  # --------------------------------------------------------------------------
  lucia-postgres:
    image: postgres:17@sha256:c274743e5423a554d3ebe3fcf73e489460397f538a1383d191a9c54774b04a49
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env}
    volumes:
      - lucia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-postgres-jetson"
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------------------------
  # Redis 8.2-alpine — session state and task persistence.
  # Image pinned to arm64 (linux/arm64/v8) manifest digest verified 2026-07-18.
  # --------------------------------------------------------------------------
  lucia-redis:
    image: redis:8.2-alpine@sha256:2322055b54f74ab399ef319077ecc75fa3a45361ac345b1a27ae1248b0c2c837
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
    volumes:
      - lucia-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-redis-jetson"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # --------------------------------------------------------------------------
  # PostgreSQL exporter — server, database, lock, and query activity metrics.
  # Image pinned to the linux/arm64 manifest digest verified 2026-08-20.
  # No host port: only the local Collector can scrape port 9187.
  # --------------------------------------------------------------------------
  lucia-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:6a3af65923aab6a73a4030724a75f6ba3fda3b437ca514274efea4593638ab7e
    depends_on:
      lucia-postgres:
        condition: service_healthy
    environment:
      - DATA_SOURCE_URI=lucia-postgres:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=postgres
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # --------------------------------------------------------------------------
  # Redis exporter — INFO, command, memory, keyspace, and client metrics.
  # Image pinned to the linux/arm64 manifest digest verified 2026-08-20.
  # No host port: only the local Collector can scrape port 9121.
  # --------------------------------------------------------------------------
  lucia-redis-exporter:
    image: oliver006/redis_exporter:v1.89.0@sha256:581c755020575ddf34a0a9ca4b6384c08b8a8ce05ee896c9c78c5556d0f018f8
    depends_on:
      lucia-redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis://lucia-redis:6379
      - REDIS_EXPORTER_PING_ON_CONNECT=true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # --------------------------------------------------------------------------
  # Jetson Collector — hostmetrics plus internal exporter scraping.
  # Image pinned to the linux/arm64 manifest digest verified 2026-08-20.
  # Exports metrics through the existing authenticated OTLP/gRPC gateway.
  # --------------------------------------------------------------------------
  lucia-telemetry:
    image: otel/opentelemetry-collector-contrib:0.139.0@sha256:2736aa38a8da17bbde16304f0d69bde1b13117034f3eb1fdc1b42ff62e8ca0b7
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      lucia-postgres-exporter:
        condition: service_started
      lucia-redis-exporter:
        condition: service_started
    environment:
      - JETSON_DEVICE_ID=${JETSON_DEVICE_ID:-orin-voice}
      - JETSON_HOST_NAME=${JETSON_HOST_NAME:-orin-voice}
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-production}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://deadpool.local.seiggy.com:4317}
      - OTEL_EXPORTER_OTLP_AUTHORIZATION=${OTEL_EXPORTER_OTLP_AUTHORIZATION:?OTEL_EXPORTER_OTLP_AUTHORIZATION not set — run via deploy-jetson.sh}
    volumes:
      - type: bind
        source: /
        target: /hostfs
        read_only: true
      - type: bind
        source: ./otel-collector-jetson.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - type: bind
        source: ${LUCIA_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "lucia-telemetry-jetson"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # --------------------------------------------------------------------------
  # AgentHost voice — CUDA-accelerated STT/VAD on Ampere (Orin Nano 8GB).
  # NVIDIA runtime + NVIDIA_VISIBLE_DEVICES exposes GPU; the Jetson voice image bakes in
  # CUDA user-space libs — no host CUDA directory mounts needed.
  # --------------------------------------------------------------------------
  lucia-agenthost-voice:
    # Content-addressed image only. The :? guard fails fast on unset/empty.
    image: ${LUCIA_IMAGE:?LUCIA_IMAGE must be an immutable ref (name@sha256:<64hex> or sha256:<64hex>)}
    runtime: nvidia
    depends_on:
      lucia-redis:
        condition: service_healthy
      lucia-postgres:
        condition: service_healthy
    ports:
      - "7233:8080"      # AgentHost HTTP API + dashboard
      - "10400:10400"    # Wyoming voice server (TCP)
    volumes:
      - lucia-plugins:/app/plugins
      - type: volume
        source: lucia-voice-data
        target: /app/data
      - type: bind
        source: ${LUCIA_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - DOTNET_RUNNING_IN_CONTAINER=true
      - COMPlus_EnableDiagnostics=0
      # NVIDIA Container Toolkit grants GPU access; the Jetson voice image ships CUDA libs internally.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Data provider
      - DataProvider__Store=PostgreSQL
      - DataProvider__Cache=Redis
      # Npgsql connection strings — pre-escaped by deploy-jetson.sh (handles passwords
      # containing ; and other special chars). Service DNS on the Compose default network.
      - ConnectionStrings__luciaconfig=${CS_LUCIACONFIG:?CS_LUCIACONFIG not set — run via deploy-jetson.sh}
      - ConnectionStrings__luciatraces=${CS_LUCIATRACES:?CS_LUCIATRACES not set — run via deploy-jetson.sh}
      - ConnectionStrings__luciatasks=${CS_LUCIATASKS:?CS_LUCIATASKS not set — run via deploy-jetson.sh}
      - ConnectionStrings__redis=lucia-redis:6379
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-}
      # Voice pipeline: CUDA execution provider (EP registration verified via Wyoming status API)
      - Wyoming__Models__HybridStt__Provider=cuda
      - Wyoming__Models__HybridStt__Enabled=true
      - Wyoming__VoiceProfiles__AudioClipBasePath=/app/data/voice-clips
      # Export low-volume metrics to the remote collector. The host CA bundle above
      # lets .NET validate its private TLS certificate.
      - Observability__Mode=${OBSERVABILITY_MODE:-Metrics}
      - OTEL_RESOURCE_ATTRIBUTES=device.id=${JETSON_DEVICE_ID:-orin-voice},host.name=${JETSON_HOST_NAME:-orin-voice},deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-production},service.namespace=lucia
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://deadpool.local.seiggy.com:4317}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:?OTEL_EXPORTER_OTLP_HEADERS must be set in environment or .env}
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "lucia-agenthost-voice"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/bin

# No explicit networks block — Compose creates a single default bridge network
# named <project>_default. All six services communicate via service-name DNS.

volumes:
  lucia-postgres-data:
  lucia-redis-data:
  lucia-plugins:
  lucia-voice-data:
