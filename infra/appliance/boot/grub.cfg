# Embedded in EFI/BOOT/grubaa64.efi. NVIDIA's L4TLauncher writes cbootargs to
# $cmdpath/boot.cfg before starting GRUB; lucia-boot-slot owns $cmdpath/lucia.env.
set timeout=0
regexp --set=1:lucia_disk '^\(([^,)]+)' "$cmdpath"
source "$cmdpath/boot.cfg"
set lucia_a=gpt1
set lucia_b=gpt2
set lucia_slot=a
load_env -f "$cmdpath/lucia.env" lucia_slot lucia_trial lucia_a lucia_b
# A trial is consumed before it boots, so a failed boot returns to the committed slot.
# Boot it only if clearing it was saved; otherwise a failing trial could repeat forever.
if [ "$lucia_trial" = a -o "$lucia_trial" = b ]; then
    set lucia_next="$lucia_trial"
    set lucia_trial=
    if save_env -f "$cmdpath/lucia.env" lucia_trial; then
        set lucia_slot="$lucia_next"
    fi
fi
if [ "$lucia_slot" = b ]; then
    set root="($lucia_disk,$lucia_b)"
else
    set root="($lucia_disk,$lucia_a)"
fi
probe --set=lucia_partuuid --part-uuid "$root"
linux /boot/Image ${cbootargs} root=PARTUUID=$lucia_partuuid rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 firmware_class.path=/etc/firmware fbcon=map:0 video=efifb:off console=tty0 efi=runtime pci=pcie_bus_perf nvme.use_threaded_interrupts=1
initrd /boot/initrd
boot
