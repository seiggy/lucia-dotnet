name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'  # Semantic versioning (vX.Y.Z and vX.Y.Z-preview.N)
  pull_request:
    branches:
      - master
  # Wait for the asset image to be built before starting, when asset.lock changes
  workflow_run:
    workflows: ["Build Assets Image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Build as preview (skips latest tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' && github.ref_type != 'tag' }}

env:
  ASSET_IMAGE: ghcr.io/${{ github.repository }}/build-assets

jobs:
  detect-asset-changes:
    name: Detect asset changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Detect asset changes across push
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          changed=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              range="$CURRENT_SHA^"
            else
              range="$BEFORE_SHA"
            fi
            if git diff --name-only "$range" "$CURRENT_SHA" |
              grep -qxE 'infra/docker/(asset\.lock|Dockerfile\.assets)'; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  prepare-assets:
    name: Prepare build assets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      image_ref: ${{ steps.resolve-asset.outputs.image_ref }}
    env:
      CAN_PUSH_ASSETS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Compute asset image reference
        id: asset-hash
        run: |
          HASH=$(cat infra/docker/asset.lock infra/docker/Dockerfile.assets | sha256sum | cut -c1-12)
          echo "image_ref=${{ env.ASSET_IMAGE }}:sha-$HASH" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.CAN_PUSH_ASSETS == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for asset image
        id: asset-image
        run: |
          if docker manifest inspect "${{ steps.asset-hash.outputs.image_ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.asset-image.outputs.exists != 'true' && env.CAN_PUSH_ASSETS == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push missing asset image
        if: steps.asset-image.outputs.exists != 'true' && env.CAN_PUSH_ASSETS == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.assets
          platforms: linux/amd64
          push: true
          tags: ${{ steps.asset-hash.outputs.image_ref }}
          cache-from: type=gha,scope=build-assets
          cache-to: type=gha,scope=build-assets,mode=max

      - name: Resolve asset image
        id: resolve-asset
        run: |
          if [[ "${{ steps.asset-image.outputs.exists }}" == "true" || "$CAN_PUSH_ASSETS" == "true" ]]; then
            echo "image_ref=${{ steps.asset-hash.outputs.image_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The exact asset image is missing and fork pull requests cannot publish packages."
            exit 1
          fi

  # ==========================================================================
  # Build all platform images using a matrix strategy
  # ==========================================================================
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [detect-asset-changes, prepare-assets]
    # When triggered by workflow_run (asset build finished), only proceed if it succeeded.
    # When triggered by push that changes asset.lock, skip — the workflow_run trigger
    # will pick it up after the asset image is ready.
    if: |
      always() &&
      needs.detect-asset-changes.result == 'success' &&
      (needs.prepare-assets.result == 'success' || needs.prepare-assets.result == 'skipped') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      needs.detect-asset-changes.outputs.changed != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: seiggy/lucia-agenthost
            dockerfile: ./infra/docker/Dockerfile
            title: Lucia Agent Host
            description: AI-powered Home Assistant agent orchestration
            platforms: linux/amd64
            cache_scope: lucia-agenthost
            tag_suffix: ""
          - image: seiggy/lucia-agenthost
            dockerfile: ./infra/docker/Dockerfile.voice
            title: Lucia Agent Host (Voice)
            platforms: linux/amd64
            cache_scope: lucia-agenthost-voice
            description: AI-powered Home Assistant agent with pre-loaded Wyoming voice models
            tag_suffix: "-voice"
          # NOTE: voice-rocm is not built in CI due to the ~25GB image size exceeding
          # GitHub Actions storage/attestation limits. See infra/docker/Dockerfile.voice-rocm
          # for self-build instructions.
          - image: seiggy/lucia-agenthost
            dockerfile: ./infra/docker/Dockerfile.voice-cpu
            title: Lucia Agent Host (Voice CPU)
            platforms: linux/amd64
            cache_scope: lucia-agenthost-voice-cpu
            description: AI-powered Home Assistant agent with pre-loaded Wyoming voice models (CPU only, no GPU dependencies)
            tag_suffix: "-voice-cpu"
          - image: seiggy/lucia-agenthost
            dockerfile: ./infra/docker/Dockerfile.ha
            title: Lucia Agent Host (HA Mono-Container)
            platforms: linux/amd64
            cache_scope: lucia-agenthost-ha-mono
            description: Home Assistant add-on — mono-container with InMemory cache, SQLite storage, CPU-only ONNX (no Redis/MongoDB required)
            tag_suffix: "-ha-mono"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Compute asset.lock hash
        id: asset-hash
        run: |
          HASH=$(cat infra/docker/asset.lock infra/docker/Dockerfile.assets | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Resolve effective build reference
        id: build-ref
        env:
          EFFECTIVE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "short_sha=${EFFECTIVE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${EFFECTIVE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(preview|insider)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Release tag must be stable, preview, or insider semantic version."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for exact asset image
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        env:
          ASSET_REF: ${{ env.ASSET_IMAGE }}:sha-${{ steps.asset-hash.outputs.hash }}
        run: |
          for attempt in {1..90}; do
            if docker manifest inspect "$ASSET_REF" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Asset image $ASSET_REF was not published within 15 minutes."
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Check for existing commit image
        id: commit-image
        if: github.event_name != 'pull_request'
        env:
          COMMIT_IMAGE: ${{ matrix.image }}:sha-${{ steps.build-ref.outputs.full_sha }}${{ matrix.tag_suffix }}
        run: |
          if docker manifest inspect "$COMMIT_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.commit-image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        if: steps.commit-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Detect preview release
        id: preview
        run: |
          IS_PREVIEW=false
          VERSION_TAG=""
          REF_NAME="${{ github.ref_name }}"
          # Strip leading 'v' prefix from tag for Docker image tags
          VERSION="${REF_NAME#v}"
          if [[ "${{ github.ref_type }}" == "tag" && "$VERSION" == *"-preview"* ]]; then
            IS_PREVIEW=true
            VERSION_TAG="$VERSION"
          elif [[ "${{ inputs.preview }}" == "true" ]]; then
            IS_PREVIEW=true
            VERSION_TAG="0.0.0-preview.$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "is_preview=$IS_PREVIEW" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }},enable=${{ github.ref_type == 'tag' && steps.preview.outputs.is_preview != 'true' }}
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }},enable=${{ github.event_name != 'workflow_run' }}
            type=ref,event=pr,suffix=${{ matrix.tag_suffix }}
            type=sha,prefix=sha-,suffix=${{ matrix.tag_suffix }},enable=${{ github.event_name != 'workflow_run' }}
            type=raw,value=sha-${{ steps.build-ref.outputs.short_sha }}${{ matrix.tag_suffix }},enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ steps.build-ref.outputs.full_sha }}${{ matrix.tag_suffix }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.preview.outputs.version_tag }}${{ matrix.tag_suffix }},enable=${{ github.event_name == 'workflow_dispatch' && steps.preview.outputs.is_preview == 'true' && steps.preview.outputs.version_tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Lucia Project
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        id: build-push
        if: steps.commit-image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope }}
            type=registry,ref=${{ matrix.image }}:${{matrix.cache_scope}}-buildcache
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
          provenance: mode=min
          sbom: true
          build-args: |
            ASSET_IMAGE=${{ github.event_name == 'pull_request' && needs.prepare-assets.outputs.image_ref || format('{0}:sha-{1}', env.ASSET_IMAGE, steps.asset-hash.outputs.hash) }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Image digest
        env:
          COMMIT_IMAGE: ${{ matrix.image }}:sha-${{ steps.build-ref.outputs.full_sha }}${{ matrix.tag_suffix }}
        run: |
          if [[ "${{ steps.commit-image.outputs.exists }}" == "true" ]]; then
            echo "Reusing $COMMIT_IMAGE"
          else
            echo "${{ matrix.image }}@${{ steps.build-push.outputs.digest }}"
          fi

  promote-channels:
    name: Promote current channels
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.event_name != 'pull_request' &&
      needs.build-and-push.result == 'success'
    concurrency:
      group: docker-channel-promotion
      cancel-in-progress: false

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Promote channels if build is still current
        env:
          EFFECTIVE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          IS_RELEASE_TAG: ${{ github.ref_type == 'tag' }}
          IS_DISPATCH_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview == true }}
        run: |
          if [[ "$IS_RELEASE_TAG" != "true" ]]; then
            master_sha=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/master | cut -f1)
            if [[ "$EFFECTIVE_SHA" != "$master_sha" ]]; then
              echo "Skipping channel promotion because master advanced to $master_sha."
              exit 0
            fi
          fi

          full_sha=$EFFECTIVE_SHA
          suffixes=("" "-voice" "-voice-cpu" "-ha-mono")
          if [[ "$IS_DISPATCH_PREVIEW" == "true" ]]; then
            version="0.0.0-preview.${EFFECTIVE_SHA:0:7}"
            for suffix in "${suffixes[@]}"; do
              docker buildx imagetools create \
                -t "seiggy/lucia-agenthost:$version${suffix}" \
                "seiggy/lucia-agenthost:sha-$full_sha${suffix}"
            done
            exit 0
          fi

          if [[ "$IS_RELEASE_TAG" == "true" ]]; then
            version="${GITHUB_REF_NAME#v}"
            minor="${version%.*}"
            for suffix in "${suffixes[@]}"; do
              source="seiggy/lucia-agenthost:sha-$full_sha${suffix}"
              docker buildx imagetools create \
                -t "seiggy/lucia-agenthost:$version${suffix}" \
                "$source"
              if [[ "$version" != *-* ]]; then
                docker buildx imagetools create \
                  -t "seiggy/lucia-agenthost:$minor${suffix}" \
                  "$source"
              fi
            done
            if [[ "$version" == *-* ]]; then
              exit 0
            fi
          fi

          if [[ "$IS_RELEASE_TAG" != "true" ]]; then
            docker buildx imagetools create \
              -t seiggy/lucia-agenthost:master \
              seiggy/lucia-agenthost:sha-$full_sha
            docker buildx imagetools create \
              -t seiggy/lucia-agenthost:master-voice \
              seiggy/lucia-agenthost:sha-$full_sha-voice
            docker buildx imagetools create \
              -t seiggy/lucia-agenthost:master-voice-cpu \
              seiggy/lucia-agenthost:sha-$full_sha-voice-cpu
            docker buildx imagetools create \
              -t seiggy/lucia-agenthost:master-ha-mono \
              seiggy/lucia-agenthost:sha-$full_sha-ha-mono
          fi

          docker buildx imagetools create \
            -t seiggy/lucia-agenthost:latest \
            seiggy/lucia-agenthost:sha-$full_sha
          docker buildx imagetools create \
            -t seiggy/lucia-agenthost:voice \
            seiggy/lucia-agenthost:sha-$full_sha-voice
          docker buildx imagetools create \
            -t seiggy/lucia-agenthost:ha-mono \
            seiggy/lucia-agenthost:sha-$full_sha-ha-mono

  # ==========================================================================
  # Security scan on push to main
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Resolve immutable scan image
        id: scan-ref
        env:
          EFFECTIVE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: echo "image_ref=seiggy/lucia-agenthost:sha-${EFFECTIVE_SHA}-voice" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.scan-ref.outputs.image_ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
