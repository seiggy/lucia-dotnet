# Scene Agent Evaluation Scenarios
# Scenes are seeded per scenario because the HA snapshot contains no scene entities.

scenarios:
  - id: activate_movie
    description: "Discover and activate the movie scene by its entity ID"
    category: control
    device_area: "Living Room"
    initial_state:
      scene.movie_mode:
        area: "Living Room"
        state: "unknown"
        attributes:
          friendly_name: "Movie Mode"
      scene.romantic:
        area: "Bedroom"
        state: "unknown"
        attributes:
          friendly_name: "Romantic"
    user_prompt: "Activate the movie scene"
    expected_tool_calls:
      - tool: ListScenes
        alternatives:
          - tool: FindScenesByArea
            arguments:
              areaName: "contains:living room"
      - tool: ActivateScene
        arguments:
          entityId: "scene.movie_mode"
    response_must_contain:
      - "movie"

  - id: activate_by_area
    description: "Find the bedroom's romantic scene and activate it"
    category: control
    device_area: "Living Room"
    initial_state:
      scene.movie_mode:
        area: "Living Room"
        state: "unknown"
        attributes:
          friendly_name: "Movie Mode"
      scene.romantic:
        area: "Bedroom"
        state: "unknown"
        attributes:
          friendly_name: "Romantic"
    user_prompt: "Turn on the romantic scene in the bedroom"
    expected_tool_calls:
      - tool: FindScenesByArea
        arguments:
          areaName: "contains:bedroom"
      - tool: ActivateScene
        arguments:
          entityId: "scene.romantic"
    response_must_contain:
      - "romantic"

  - id: list_scenes
    description: "List all three available scenes"
    category: query
    initial_state:
      scene.movie_mode:
        area: "Living Room"
        state: "unknown"
        attributes:
          friendly_name: "Movie Mode"
      scene.romantic:
        area: "Bedroom"
        state: "unknown"
        attributes:
          friendly_name: "Romantic"
      scene.goodnight:
        area: "Bedroom"
        state: "unknown"
        attributes:
          friendly_name: "Goodnight"
    user_prompt: "What scenes are available?"
    expected_tool_calls:
      - tool: ListScenes
    response_must_contain:
      - "movie"
      - "romantic"
      - "goodnight"

  - id: activate_goodnight
    description: "Discover and activate the goodnight scene"
    category: control
    device_area: "Bedroom"
    initial_state:
      scene.goodnight:
        area: "Bedroom"
        state: "unknown"
        attributes:
          friendly_name: "Goodnight"
    user_prompt: "Goodnight scene please"
    expected_tool_calls:
      - tool: ListScenes
        alternatives:
          - tool: FindScenesByArea
            arguments:
              areaName: "contains:bedroom"
      - tool: ActivateScene
        arguments:
          entityId: "scene.goodnight"
    response_must_contain:
      - "goodnight"

  - id: out_of_domain
    description: "Reject a thermostat request without activating a scene"
    category: out-of-domain
    initial_state:
      scene.movie_mode:
        area: "Living Room"
        state: "unknown"
        attributes:
          friendly_name: "Movie Mode"
    user_prompt: "Set the thermostat to 72"
    expected_tool_calls: []
    response_must_not_contain:
      - "activated"
