  # --- Comfort Adjustment: I'm cold ---
  - id: comfort_im_cold
    description: "User says they're cold — agent should raise temperature"
    category: control
    device_area: "Living Room"
    initial_state:
      climate.living_room_thermostat:
        area: "Living Room"
        state: "heat"
        attributes:
          friendly_name: "Living Room Thermostat"
          temperature: 66
          current_temperature: 65
          hvac_modes: ["off", "heat", "cool", "auto"]
    user_prompt: "I'm cold"
    expected_tool_calls:
      - tool: GetComfortAdjustment
        arguments: {}
      - tool: FindClimateDevicesByArea
        arguments:
          areaName: "contains:living room"
        alternatives:
          - tool: FindClimateDevice
            arguments:
              searchTerm: "contains:living room"
      - tool: GetClimateState
        arguments:
          entityId: "climate.living_room_thermostat"
      - tool: SetClimateTemperature
