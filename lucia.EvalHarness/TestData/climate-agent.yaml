# Climate Agent Evaluation Scenarios
# Each scenario defines: known HA state -> user prompt -> expected tool calls -> expected outcome
# Entity IDs are plausible climate entities (no climate entities in current HA snapshot)
#
# The ClimateAgent uses a two-step tool calling pattern: Find device first, then
# call the action tool with the resolved entity ID. Scenarios expect both steps.

scenarios:

  # --- Control: Set Temperature ---
  - id: set_temperature_72
    description: "Set thermostat to 72 degrees"
    category: control
    device_area: "Living Room"
    initial_state:
      climate.living_room_thermostat:
        area: "Living Room"
        state: "heat"
        attributes:
          friendly_name: "Living Room Thermostat"
          temperature: 68
          current_temperature: 67
          hvac_modes: ["off", "heat", "cool", "auto"]
      climate.bedroom_thermostat:
        area: "Bedroom"
        state: "cool"
        attributes:
          friendly_name: "Bedroom Thermostat"
          temperature: 74
          current_temperature: 75
          hvac_modes: ["off", "heat", "cool", "auto"]
    user_prompt: "Set the thermostat to 72 degrees"
    expected_tool_calls:
      - tool: FindClimateDevicesByArea
        arguments:
          areaName: "contains:living room"
        alternatives:
          - tool: FindClimateDevice
            arguments:
              searchTerm: "contains:living room"
      - tool: SetClimateTemperature
        arguments:
          entityId: "climate.living_room_thermostat"
          temperature: "*"
    response_must_contain:
      - "72"
    expected_final_state:
      climate.living_room_thermostat:
        state: "heat"
        attributes:
          temperature: "72"
      climate.bedroom_thermostat:
        state: "cool"
        attributes:
          temperature: "74"

  # --- Control: Set Temperature (bedroom) ---
  - id: set_bedroom_temp_70
    description: "Set bedroom thermostat to 70 degrees"
    category: control
    device_area: "Living Room"
    initial_state:
      climate.bedroom_thermostat:
        area: "Bedroom"
        state: "cool"
        attributes:
          friendly_name: "Bedroom Thermostat"
          temperature: 74
          current_temperature: 75
          hvac_modes: ["off", "heat", "cool", "auto"]
    user_prompt: "Set the bedroom thermostat to 70"
    expected_tool_calls:
      - tool: FindClimateDevice
        arguments:
          searchTerm: "contains:bedroom"
        alternatives:
          - tool: FindClimateDevicesByArea
            arguments:
              areaName: "contains:bedroom"
      - tool: SetClimateTemperature
        arguments:
          entityId: "climate.bedroom_thermostat"
          temperature: "*"
    response_must_contain:
      - "70"
    expected_final_state:
      climate.bedroom_thermostat:
        state: "cool"
        attributes:
          temperature: "70"

  # --- STT Robustness: Misspelled temperature command ---
  - id: stt_set_thermometer_72
    description: "Handle STT transcription errors (thermometer instead of thermostat)"
    category: stt-robustness
    device_area: "Living Room"
    initial_state:
      climate.living_room_thermostat:
        area: "Living Room"
        state: "heat"
        attributes:
          friendly_name: "Living Room Thermostat"
          temperature: 68
          current_temperature: 67
          hvac_modes: ["off", "heat", "cool", "auto"]
    user_prompt: "set thermometer to seventy two"
    expected_tool_calls:
      - tool: FindClimateDevice
        arguments:
          searchTerm: "contains:living room"
        alternatives:
          - tool: FindClimateDevicesByArea
            arguments:
              areaName: "contains:living room"
      - tool: SetClimateTemperature
        arguments:
          entityId: "climate.living_room_thermostat"
          temperature: "*"
    expected_final_state:
      climate.living_room_thermostat:
        state: "heat"
        attributes:
          temperature: "72"

  # --- Query: Get Current Temperature ---
  - id: query_living_room_temp
    description: "Ask about the current temperature"
    category: query
    device_area: "Bedroom"
    initial_state:
      climate.living_room_thermostat:
        area: "Living Room"
        state: "heat"
        attributes:
          friendly_name: "Living Room Thermostat"
          temperature: 72
          current_temperature: 69
          hvac_modes: ["off", "heat", "cool", "auto"]
    user_prompt: "What's the temperature in the living room?"
    expected_tool_calls:
      - tool: FindClimateDevicesByArea
        arguments:
          areaName: "contains:living room"
        alternatives:
          - tool: FindClimateDevice
            arguments:
              searchTerm: "contains:living room"
      - tool: GetClimateState
        arguments:
          entityId: "climate.living_room_thermostat"
    response_must_contain:
      - "69"

  # --- Query: Get HVAC State ---
  - id: query_thermostat_state
